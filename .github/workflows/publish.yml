name: Publish

# npm releases, in order of preference:
#   1. Trusted publishing (OIDC): push a v* tag. No long-lived token — npm mints
#      a short-lived credential for this workflow run and attaches a provenance
#      attestation. One-time setup on npmjs.com: package graphyloop -> Settings ->
#      Trusted publishing -> GitHub Actions, repo chadixearth/graphyloop,
#      workflow file publish.yml.
#   2. NPM_TOKEN secret: used automatically when trusted publishing is not
#      configured. An invalid token is reported, not fatal, so OIDC still runs.
#   3. workflow_dispatch with the `otp` input: publish with a one-time code.
#   - workflow_dispatch with `dry_run=true`: pack + test only, no publish.
#   - A version already on the registry is skipped (idempotent re-runs).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm 2FA one-time password (publish via OTP)'
        required: false
      dry_run:
        description: 'Pack + test only, do not publish (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Tag matches package.json version (gate)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "VERSION_MISMATCH: tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "version gate ok: $PKG"

      - name: Test suite (gate)
        run: node scripts/run-tests.mjs

      - name: Already published?
        id: exists
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "graphyloop@$PKG" version >/dev/null 2>&1; then
            echo "VERSION_EXISTS: graphyloop@$PKG is already on the registry, skipping publish"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      # Diagnostic only: OIDC does not need the token, so a stale token must not
      # block the release. A broken token reads as `E404 PUT .../graphyloop`
      # later, which looks like "package missing" — say what is wrong up front.
      - name: NPM_TOKEN diagnostic
        if: ${{ steps.exists.outputs.yes != 'true' }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "no NPM_TOKEN secret: relying on trusted publishing"; exit 0; fi
          if WHO=$(npm whoami 2>&1); then echo "NPM_TOKEN authenticates as: $WHO"
          else echo "::warning::NPM_TOKEN is not usable ($WHO). Trusted publishing will be tried; if it is not configured, mint a granular token with read+write on graphyloop and update the secret."; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (trusted publishing or token)
        if: ${{ steps.exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' && (github.event.inputs.otp == '' || github.event.inputs.otp == null) }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OTP)
        if: ${{ steps.exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.otp != '' && github.event.inputs.otp != null }}
        run: npm publish --provenance --access public --otp "${{ github.event.inputs.otp }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run (pack + verify, no publish)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run
