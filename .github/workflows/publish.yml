name: Publish

# npm releases, in order of preference:
#   1. Trusted publishing (OIDC): push a v* tag. No long-lived token — npm mints
#      a short-lived credential for this workflow run and attaches a provenance
#      attestation. One-time setup: npmjs.com -> graphyloop -> Settings ->
#      Trusted Publisher -> GitHub Actions (chadixearth / graphyloop /
#      publish.yml, environment blank), or from a logged-in shell:
#      npm trust github graphyloop --file publish.yml --repository chadixearth/graphyloop
#   2. NPM_TOKEN secret: used automatically when trusted publishing is not
#      configured. An invalid token is reported, not fatal, so OIDC still runs.
#   3. workflow_dispatch with the `otp` input: publish with a one-time code.
#   - workflow_dispatch with `dry_run=true`: pack + test only, no publish.
#   - A version already on the registry is skipped (idempotent re-runs).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm 2FA one-time password (publish via OTP)'
        required: false
      dry_run:
        description: 'Pack + test only, do not publish (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write # trusted publishing + provenance

jobs:
  publish:
    # Releases come from a v* tag or a manual run on main, never a feature branch.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1; upgrade only when the bundled npm is older.
      - name: Ensure npm supports trusted publishing
        run: |
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" || npm install -g npm@11
          npm --version

      - name: Tag matches package.json version (gate)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "VERSION_MISMATCH: tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "version gate ok: $PKG"

      - name: Test suite (gate)
        run: node scripts/run-tests.mjs

      - name: Already published?
        id: exists
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "graphyloop@$PKG" version >/dev/null 2>&1; then
            echo "VERSION_EXISTS: graphyloop@$PKG is already on the registry, skipping publish"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      # Diagnostic only: OIDC does not need the token, so a stale token must not
      # block the release. A broken token reads as `E404 PUT .../graphyloop`
      # later, which looks like "package missing" — say what is wrong up front.
      - name: NPM_TOKEN diagnostic
        if: ${{ steps.exists.outputs.yes != 'true' }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "no NPM_TOKEN secret: relying on trusted publishing"; exit 0; fi
          if WHO=$(npm whoami 2>&1); then echo "NPM_TOKEN authenticates as: $WHO"
          else echo "::warning::NPM_TOKEN is not usable ($WHO). Trusted publishing will be tried; if it is not configured, mint a granular token with read+write on graphyloop and update the secret."; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm tries the OIDC exchange first and, when it is rejected, silently
      # falls back to NODE_AUTH_TOKEN; with a stale token that surfaces only as
      # `E404 PUT`. Run the exchange here so the log says exactly why npm
      # rejected this workflow (the token itself is never printed).
      - name: Trusted publishing preflight (diagnostic)
        if: ${{ steps.exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          node --input-type=module -e '
            const pkg = JSON.parse((await import("node:fs")).readFileSync("package.json", "utf8")).name;
            const u = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            u.searchParams.set("audience", "npm:registry.npmjs.org");
            const res = await fetch(u, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
            const id = (await res.json()).value;
            const c = JSON.parse(Buffer.from(id.split(".")[1], "base64url").toString("utf8"));
            console.log("OIDC claims:", JSON.stringify({ repository: c.repository, repository_owner: c.repository_owner, workflow_ref: c.workflow_ref, ref: c.ref, environment: c.environment ?? null }));
            const r = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(pkg)}`, { method: "POST", headers: { Authorization: `Bearer ${id}` } });
            if (r.ok) console.log(`TRUSTED_PUBLISHING_OK: npm accepts this workflow for ${pkg}`);
            else console.log(`::warning::TRUSTED_PUBLISHING_REJECTED (HTTP ${r.status}): ${(await r.text()).slice(0, 400)}`);
          '

      - name: Publish to npm (trusted publishing or token)
        if: ${{ steps.exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' && (github.event.inputs.otp == '' || github.event.inputs.otp == null) }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OTP)
        if: ${{ steps.exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.otp != '' && github.event.inputs.otp != null }}
        run: npm publish --provenance --access public --otp "${{ github.event.inputs.otp }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run (pack + verify, no publish)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run

      - name: Already on MCP Registry?
        id: mcp_exists
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').mcpName")
          RESP=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=$NAME" || echo '{}')
          if node -e '
            const [raw, name, ver] = process.argv.slice(1);
            try {
              const data = JSON.parse(raw);
              const list = Array.isArray(data.servers) ? data.servers : [];
              const hit = list.some((s) => {
                const srv = s.server || s;
                return srv && srv.name === name && srv.version === ver;
              });
              process.exit(hit ? 0 : 1);
            } catch {
              process.exit(1);
            }
          ' "$RESP" "$NAME" "$PKG"; then
            echo "MCP_VERSION_EXISTS: $NAME@$PKG is already on the MCP Registry, skipping"
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      # The MCP Registry validates the npm package (mcpName) at publish time, and
      # npm now processes a fresh release for a few minutes before serving it
      # ("Your package is being processed"), so wait until npm serves this
      # exact version.
      - name: Wait for npm to serve this version
        if: ${{ steps.mcp_exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 60); do
            if curl -fsS "https://registry.npmjs.org/$NAME/$PKG" >/dev/null 2>&1; then echo "npm serves $NAME@$PKG"; exit 0; fi
            sleep 10
          done
          echo "::error::$NAME@$PKG is still not visible on npm after 10 minutes"
          exit 1

      - name: Publish to MCP Registry (GitHub OIDC)
        if: ${{ steps.mcp_exists.outputs.yes != 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
