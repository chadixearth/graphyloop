name: Publish

# Automatic npm releases:
#   - workflow_dispatch with the `otp` input: publish with a one-time code
#   - workflow_dispatch with `dry_run=true`: validate the pipeline, no ship
#   - push a v* tag: run the test gate, then publish only if the NPM_TOKEN
#     secret exists (token presence is checked in a step, since env/secrets
#     contexts are not available in step-level `if` conditions)
#   - npm publish is skipped when the version already exists on the registry
#     (idempotent re-runs: a manual publish or a re-pushed tag must not fail
#     the workflow with an E409 conflict)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      otp:
        description: 'npm 2FA one-time password (publish via OTP)'
        required: false
      dry_run:
        description: 'Pack + test only, do not publish (true/false)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Tag matches package.json version (gate)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "VERSION_MISMATCH: tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "version gate ok: $PKG"

      - name: Test suite (gate)
        run: node scripts/run-tests.mjs

      - name: Check NPM_TOKEN presence
        id: tokencheck
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (token)
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event.inputs.otp == '' || github.event.inputs.otp == null) && steps.tokencheck.outputs.present == 'yes' }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "graphyloop@$PKG" version >/dev/null 2>&1; then
            echo "VERSION_EXISTS: graphyloop@$PKG is already on the registry, skipping publish"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OTP)
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.otp != '' && github.event.inputs.otp != null }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "graphyloop@$PKG" version >/dev/null 2>&1; then
            echo "VERSION_EXISTS: graphyloop@$PKG is already on the registry, skipping publish"
            exit 0
          fi
          npm publish --otp "${{ github.event.inputs.otp }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skipped (no token, no otp)
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event.inputs.otp == '' || github.event.inputs.otp == null) && steps.tokencheck.outputs.present == 'no' }}
        run: 'echo "PUBLISH_SKIPPED: add the NPM_TOKEN secret or run with the otp input to publish"'

      - name: Dry run (pack + verify, no publish)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run
